name: Windows build

# Push to main / pull request: only `cargo test -p pos-core` on Linux (cheap:
# Windows runners cost twice as many Actions minutes, and the repository may
# become private, where minutes are limited).
#
# Full Windows build (tests + installers + offline installer): only on
# Actions > Windows build > Run workflow, or when a v* tag is pushed. Without
# "Publish a release" ticked, a manual run is a check only: the installers are
# not kept, so no Actions artifact storage is used.
#
# To publish a release: Actions > Windows build > Run workflow, tick
# "Publish a release". The release is tagged v<version from tauri.conf.json>.
# Pushing a tag such as v0.2.0 does the same. A release is published to:
#   1. GitHub Releases (installers + latest.json with GitHub download links),
#      as before. This is the fallback update source while the repo is public.
#   2. Cloudflare R2 (public bucket, R2_PUBLIC_URL below), by the "r2" job on
#      Linux, when the secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#      R2_ACCOUNT_ID and R2_BUCKET are set. It downloads the files of the
#      GitHub release just published, uploads the installers to v<version>/,
#      then latest.json (pointing at those copies) to the bucket root LAST,
#      and downloads both back from the public URL to check them. Only the
#      newest 3 v*/ folders are kept. Installed apps check R2 first (see
#      plugins.updater.endpoints in src-tauri/tauri.conf.json), so R2 keeps
#      updates working once the repository is private. Without the secrets R2
#      is skipped with a warning, unless R2 already serves a latest.json: then
#      the run fails, because apps would keep finding that older version on R2.
#
# To repeat only the R2 part (for example after fixing an R2 secret): Run
# workflow, tick "Only publish to R2" (r2_only). Nothing is built: the files
# of the existing GitHub release v<version from tauri.conf.json> on the chosen
# branch are copied to R2, with the same signature.
# Installers are published as PuppxPOS_<version>_... (DIST_NAME below); the
# build keeps productName "POS" so existing installs update in place.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<app version>) with the installers"
        type: boolean
        default: false
      r2_only:
        description: "Only publish to R2: no build; copy the existing GitHub release v<app version> to R2"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish releases

# A newer push to main (or to the same pull request) cancels the test run it
# replaces. Manual runs and tag builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # Name the installers are published under (PuppxPOS_<version>_x64-setup.exe
  # and so on). Cosmetic: the build itself keeps productName "POS" in
  # tauri.conf.json, which fixes the install folder, the Apps & features entry
  # and the shortcuts of existing installs (changing it would install a second
  # copy next to the old one). Installed apps find the files through
  # latest.json, which is written below with these names.
  DIST_NAME: PuppxPOS
  # Public URL of the R2 bucket. Must match the first updater endpoint in
  # src-tauri/tauri.conf.json (checked below).
  R2_PUBLIC_URL: https://pub-b63dc99b79b64fe2b2644bcf0ec1391b.r2.dev

jobs:
  test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          echo "tauri.conf.json=$app Cargo.toml=$crate"
          if [ "$app" != "$crate" ]; then
            echo "::error::Version mismatch: tauri.conf.json has $app, Cargo.toml has $crate"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

  build:
    if: (github.event_name == 'workflow_dispatch' && !inputs.r2_only) || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and whether to release
        id: ver
        shell: bash
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          echo "tauri.conf.json=$app Cargo.toml=$crate"
          if [ "$app" != "$crate" ]; then
            echo "::error::Version mismatch: tauri.conf.json has $app, Cargo.toml has $crate"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            if [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $app"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            release=true
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Updates are signed with the private key stored in the repository secret
      # TAURI_SIGNING_PRIVATE_KEY; installed apps only accept updates signed
      # with it. Without the secret the installers are still built, just
      # without auto-update files.
      - name: Build installers (NSIS .exe + MSI)
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            npx --yes @tauri-apps/cli@2 build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set: building without automatic-update files"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # latest.json is what installed apps download to learn about new versions.
      - name: Write update manifest (latest.json)
        if: steps.build.outputs.signed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          exe=$(ls target/release/bundle/nsis/*-setup.exe)
          node -e '
            const fs = require("fs"), path = require("path");
            const [exe, version, repo, distName] = process.argv.slice(1);
            const signature = fs.readFileSync(exe + ".sig", "utf8").trim();
            // The name "Collect installers" below gives the file (POS_... -> PuppxPOS_...).
            const built = path.basename(exe);
            if (!distName) { console.error("DIST_NAME is not set"); process.exit(1); }
            if (!built.startsWith("POS_")) { console.error(`unexpected installer name ${built}`); process.exit(1); }
            const published = distName + built.slice(3);
            const url = `https://github.com/${repo}/releases/download/v${version}/${published}`;
            const target = { signature, url };
            fs.writeFileSync("latest.json", JSON.stringify({
              version, notes: `${distName} v${version}`, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": target, "windows-x86_64-nsis": target },
            }, null, 2));
          ' "$exe" "$VERSION" "$GITHUB_REPOSITORY" "$DIST_NAME"
          cat latest.json

      # Keep the normal installers before the offline build below writes
      # its own setup .exe to the same folder. They are renamed from POS_* to
      # $DIST_NAME_* (the name latest.json above points at).
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig target/release/bundle/msi/*.msi; do
            name=$(basename "$f")
            case "$name" in
              POS_*) cp "$f" "dist/${DIST_NAME}_${name#POS_}" ;;
              *) echo "::error::Unexpected installer name $name (expected POS_...)"; exit 1 ;;
            esac
          done
          if ! compgen -G "dist/*-setup.exe" > /dev/null || ! compgen -G "dist/*.msi" > /dev/null; then
            echo "::error::No setup .exe or .msi was built"; exit 1
          fi
          [ -f latest.json ] && cp latest.json dist/ || true
          ls -la dist

      # Offline installer: includes the whole Microsoft WebView2 runtime, so
      # it installs on PCs with no internet (the normal installer downloads
      # WebView2 during setup when Windows does not have it). Bigger, so it
      # is an extra download; updates keep using the normal installer.
      # Built for releases and manual runs (this job only runs for those).
      - name: Build offline installer (WebView2 included)
        if: github.event_name == 'workflow_dispatch' || steps.ver.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config \
            '{"bundle":{"createUpdaterArtifacts":false,"windows":{"webviewInstallMode":{"type":"offlineInstaller","silent":true}}}}'
          cp target/release/bundle/nsis/*-setup.exe "dist/${DIST_NAME}_${VERSION}_x64-offline-setup.exe"
          ls -la dist

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.DIST_NAME }} v${{ steps.ver.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.exe.sig
            dist/*.msi
            dist/latest.json
          body: |
            **New install:** download `${{ env.DIST_NAME }}_${{ steps.ver.outputs.version }}_x64-setup.exe` below and run it.

            **No internet on the PC?** Download `${{ env.DIST_NAME }}_${{ steps.ver.outputs.version }}_x64-offline-setup.exe`
            instead (bigger: it includes Microsoft WebView2, which the normal
            installer downloads during setup if Windows does not have it).
            Copy it to the PC with a USB stick and run it.

            **Already installed (v0.5.0 or later):** the app finds this update by
            itself; an admin taps **Install update** and it restarts. All data is
            kept (it lives in `%APPDATA%\com.puppx.pos`).

            Windows may show "Windows protected your PC" because the installer is
            not code-signed yet: click **More info → Run anyway**.

  # ---------- Update hosting on Cloudflare R2 ----------
  # Runs after a release (on Linux: cheaper, and no Git Bash path quirks), or
  # alone with Run workflow > "Only publish to R2" (r2_only) to repeat just this
  # part for the GitHub release v<version from tauri.conf.json>. Both take the
  # files from that GitHub release, so R2 serves exactly the bytes and
  # signature published there, and nothing is rebuilt.
  #
  # Installed apps ask R2 first. The updater only moves on to the GitHub
  # endpoint when R2 fails (no answer, an error status such as 404, or JSON
  # that is not a manifest); a valid but OLD latest.json on R2 stops it there
  # ("up to date"). So once R2 has a latest.json, every release must replace it.
  r2:
    needs: build
    if: >-
      !cancelled() && (
        (needs.build.result == 'success' && needs.build.outputs.release == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.r2_only)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      # Newer AWS CLIs send checksums R2 does not accept.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          if [ -n "$BUILT_VERSION" ] && [ "$BUILT_VERSION" != "$app" ]; then
            echo "::error::The build made $BUILT_VERSION but tauri.conf.json says $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "R2 publish for v$app"

      # Checks the R2 secrets and cleans them up: stray spaces or line breaks
      # are removed, and R2_ACCOUNT_ID may also be given as the S3 endpoint
      # (https://<id>.r2.cloudflarestorage.com). Problems are explained without
      # printing the values.
      - name: R2 - check setup
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SIGNED: ${{ needs.build.outputs.signed }}
          R2_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.r2_only }}
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          # The apps must be asking this bucket, or publishing to it is pointless.
          if ! grep -qF "\"$R2_PUBLIC_URL/latest.json\"" src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json has no updater endpoint $R2_PUBLIC_URL/latest.json: update R2_PUBLIC_URL in the workflow or the config"
            exit 1
          fi
          if [ "$SIGNED" = "false" ]; then
            echo "::warning::Unsigned build (no TAURI_SIGNING_PRIVATE_KEY): no latest.json, so nothing is published to R2"
            exit 0
          fi
          clean() { printf '%s' "$1" | tr -d ' \t\r\n'; }
          # What is wrong with a value, without showing it.
          describe() {
            local v="$1" d
            d="length ${#v}, ${#2} after removing spaces/line breaks"
            if [[ "$v" == *$'\n'* || "$v" == *$'\r'* ]]; then d="$d, has a line break"; fi
            if [[ "$v" == *' '* || "$v" == *$'\t'* ]]; then d="$d, has spaces/tabs"; fi
            if [[ "$v" == *http* ]]; then d="$d, contains \"http\""; fi
            if [[ "$v" == *.* ]]; then d="$d, has dots"; fi
            if [[ "$v" == */* ]]; then d="$d, has slashes"; fi
            if [[ "$v" =~ [A-Z] ]]; then d="$d, has uppercase letters"; fi
            if [[ "$v" == *_* ]]; then d="$d, has underscores"; fi
            echo "$d"
          }
          key=$(clean "$R2_ACCESS_KEY_ID"); secret=$(clean "$R2_SECRET_ACCESS_KEY")
          acct_in=$(clean "$R2_ACCOUNT_ID"); bucket=$(clean "$R2_BUCKET")
          missing=""
          [ -n "$key" ] || missing="$missing R2_ACCESS_KEY_ID"
          [ -n "$secret" ] || missing="$missing R2_SECRET_ACCESS_KEY"
          [ -n "$acct_in" ] || missing="$missing R2_ACCOUNT_ID"
          [ -n "$bucket" ] || missing="$missing R2_BUCKET"
          if [ -n "$missing" ]; then
            # Is R2 already live? Then skipping it would leave installed apps
            # on the version in that latest.json, silently.
            code=$(curl -s -o r2-probe.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$R2_PUBLIC_URL/latest.json" || true)
            if [ "$code" = "200" ] || [ "$R2_ONLY" = "true" ]; then
              live=$(node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version) } catch { console.log("none") }' r2-probe.json 2>/dev/null || echo none)
              echo "::error::R2 secrets missing or empty:$missing. R2 latest.json: $live (HTTP $code). Installed apps check R2 first: add the secrets (Settings > Secrets and variables > Actions) and run again with \"Only publish to R2\" ticked."
              exit 1
            fi
            echo "::warning::R2 secrets missing:$missing. Skipping the R2 upload (R2 has no latest.json yet, HTTP $code, so apps fall back to GitHub Releases). Updates will stop working when the repository is made private."
            exit 0
          fi

          bad=0
          # Account ID: 32 hex characters. Also accepted: the S3 endpoint
          # https://<id>.r2.cloudflarestorage.com (or <id>.eu.r2...), with or
          # without https:// and a trailing slash.
          acct=$(printf '%s' "$acct_in" | tr 'A-F' 'a-f')
          acct=${acct#https://}; acct=${acct#http://}; acct=${acct%%/*}
          jurisdiction=""
          if [[ "$acct" =~ ^([0-9a-f]{32})(\.(eu|fedramp))?\.r2\.cloudflarestorage\.com$ ]]; then
            acct=${BASH_REMATCH[1]}; jurisdiction=${BASH_REMATCH[3]}
            echo "::notice::R2_ACCOUNT_ID holds the S3 endpoint; using the account ID from it."
          fi
          if ! [[ "$acct" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID is not a Cloudflare account ID (expected 32 characters 0-9 a-f, as shown in R2 > Account details; got $(describe "$R2_ACCOUNT_ID" "$acct_in")). Fix the R2_ACCOUNT_ID secret."
            bad=1
          fi
          # Bucket: R2 rules, 3-63 characters, lowercase letters, digits and
          # hyphens, starting and ending with a letter or digit.
          if ! [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::R2_BUCKET is not a valid R2 bucket name (expected 3-63 characters: lowercase letters, digits and hyphens, not starting or ending with a hyphen; got $(describe "$R2_BUCKET" "$bucket")). Fix the R2_BUCKET secret: it is only the bucket name, not a URL."
            bad=1
          fi
          # R2 API tokens: Access Key ID 32 hex characters, Secret Access Key 64.
          # Only warned about, in case Cloudflare changes the format.
          if ! [[ "$key" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::warning::R2_ACCESS_KEY_ID does not look like an R2 Access Key ID (32 characters 0-9 a-f; got $(describe "$R2_ACCESS_KEY_ID" "$key")). If uploads fail with an access error, fix that secret."
          fi
          if ! [[ "$secret" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::R2_SECRET_ACCESS_KEY does not look like an R2 Secret Access Key (64 characters 0-9 a-f; got $(describe "$R2_SECRET_ACCESS_KEY" "$secret")). If uploads fail with an access error, fix that secret."
          fi
          [ "$bad" = 0 ] || exit 1

          # The cleaned values may differ from the stored secrets, so they are
          # masked in the log too.
          for v in "$key" "$secret" "$acct" "$bucket"; do echo "::add-mask::$v"; done
          {
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "R2_BUCKET=$bucket"
            # No trailing slash.
            echo "R2_ENDPOINT=https://$acct${jurisdiction:+.$jurisdiction}.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"
          # Path-style requests (https://<endpoint>/<bucket>/<key>): the bucket
          # never becomes part of a host name. The CLI only reads this from its
          # config file (there is no environment variable for it). The classic
          # transfer client is the one long known to work with R2; newer CLIs
          # otherwise pick the CRT client.
          aws --version
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.preferred_transfer_client classic
          echo "s3.addressing_style=$(aws configure get default.s3.addressing_style) s3.preferred_transfer_client=$(aws configure get default.s3.preferred_transfer_client)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # The files exactly as published on the GitHub release.
      - name: Get the release files from GitHub
        id: files
        if: steps.r2.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir dist --clobber \
            --pattern '*-setup.exe' --pattern '*-setup.exe.sig' --pattern '*.msi' --pattern 'latest.json'
          ls -la dist
          if [ ! -f dist/latest.json ]; then
            echo "::error::The GitHub release v$VERSION has no latest.json (built without the signing key?): nothing to publish to R2"
            exit 1
          fi

      # Order matters: installers first and checked, latest.json last, so an
      # app never sees a manifest that points at files not there yet.
      - name: R2 - upload installers, then latest.json, and verify
        if: steps.r2.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          setup=""; offline=""; msi=""
          for f in *-setup.exe; do
            case "$f" in
              *-offline-setup.exe) offline="$f" ;;
              *) [ -z "$setup" ] || { echo "::error::More than one setup .exe in the release"; exit 1; }; setup="$f" ;;
            esac
          done
          for f in *.msi; do msi="$f"; done
          for f in "$setup" "$setup.sig" "$msi" "$offline" latest.json; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "::error::Missing file for R2 in the release: '$f'"; ls -la; exit 1
            fi
          done
          prefix="v$VERSION"
          base="$R2_PUBLIC_URL/$prefix"

          # R2 manifest: the GitHub one with the download links moved to R2.
          node -e '
            const fs = require("fs");
            const [setup, base, version] = process.argv.slice(1);
            const m = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            if (m.version !== version) { console.error(`latest.json is for ${m.version}, not ${version}`); process.exit(1); }
            const sig = fs.readFileSync(setup + ".sig", "utf8").trim();
            const targets = ["windows-x86_64", "windows-x86_64-nsis"];
            for (const t of targets) {
              const p = m.platforms && m.platforms[t];
              if (!p || p.signature !== sig || !p.url.endsWith("/" + setup)) {
                console.error(`latest.json entry ${t} does not match ${setup}`); process.exit(1);
              }
              p.url = `${base}/${setup}`;
            }
            fs.writeFileSync("latest-r2.json", JSON.stringify(m, null, 2));
          ' "$setup" "$base" "$VERSION"
          cat latest-r2.json; echo

          s3() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --no-progress; }
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          # Download a public URL (bypassing caches) and compare it with a local file.
          check() {
            local url="$1" file="$2" got want
            rm -f ../r2-check.bin
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -H 'Cache-Control: no-cache' -o ../r2-check.bin "$url" \
              || { echo "::error::Could not download $url"; return 1; }
            got=$(sha ../r2-check.bin); want=$(sha "$file")
            rm -f ../r2-check.bin
            if [ "$got" != "$want" ]; then
              echo "::error::$url sha256 $got does not match the release's $file ($want)"; return 1
            fi
            echo "OK $url sha256 $got"
          }

          # Refuse to point latest.json back at an older version (for example
          # when an old release is run again).
          live="none"
          code=$(curl -s -o ../r2-live.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$R2_PUBLIC_URL/latest.json" || true)
          if [ "$code" = "200" ]; then
            live=$(node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version) } catch { console.log("unreadable") }' ../r2-live.json)
          fi
          echo "R2 latest.json now: $live (HTTP $code)"
          newer=$(node -e '
            const [live, mine] = process.argv.slice(1);
            const p = v => (v.match(/^(\d+)\.(\d+)\.(\d+)/) || []).slice(1).map(Number);
            const a = p(live), b = p(mine);
            let r = false;
            if (a.length === 3) for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) { r = a[i] > b[i]; break; } }
            console.log(r);
          ' "$live" "$VERSION")
          if [ "$newer" = "true" ]; then
            echo "::error::R2 already announces $live, newer than $VERSION: not replacing latest.json"
            exit 1
          fi

          # 1. Installers (same file names as on GitHub Releases).
          for f in "$setup" "$setup.sig" "$msi" "$offline"; do
            s3 cp "$f" "s3://$R2_BUCKET/$prefix/$f" --cache-control no-cache
          done
          # 2. Check them from the public URL before announcing them.
          for f in "$setup" "$setup.sig" "$msi" "$offline"; do
            check "$base/$f" "$f"
          done
          # 3. The manifest: a copy kept with the version (handy to roll back:
          #    copy it to the root), then the root latest.json the apps read.
          s3 cp latest-r2.json "s3://$R2_BUCKET/$prefix/latest.json" --cache-control no-cache --content-type application/json
          s3 cp latest-r2.json "s3://$R2_BUCKET/latest.json" --cache-control no-cache --content-type application/json
          # 4. Check what the apps will now see.
          ok=false
          for _ in 1 2 3 4 5 6; do
            if check "$R2_PUBLIC_URL/latest.json" latest-r2.json; then ok=true; break; fi
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::error::$R2_PUBLIC_URL/latest.json is not the manifest just uploaded"; exit 1
          fi
          {
            echo "### Published to R2 (v$VERSION)"
            echo "- Update manifest: $R2_PUBLIC_URL/latest.json"
            echo "- Installer: $base/$setup"
            echo "- Offline installer: $base/$offline"
            echo "- MSI: $base/$msi"
          } >> "$GITHUB_STEP_SUMMARY"

      # Offline installers are big and the free tier is 10 GB: keep the newest
      # 3 version folders (never the one just published, never latest.json).
      # A failure here does not fail the run.
      - name: R2 - remove old versions
        if: steps.r2.outputs.enabled == 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          folders=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix v --delimiter / \
            --query 'CommonPrefixes[].Prefix' --output text --endpoint-url "$R2_ENDPOINT" | tr -d '\r')
          echo "Version folders on R2: $folders"
          # $folders is split into one argument per folder on purpose.
          # shellcheck disable=SC2086
          old=$(node -e '
            const [keep, current, ...all] = process.argv.slice(1);
            const p = f => f.match(/^v(\d+)\.(\d+)\.(\d+)\/$/);
            const cmp = (x, y) => { const a = p(x), b = p(y);
              for (let i = 1; i <= 3; i++) if (+a[i] !== +b[i]) return +b[i] - +a[i];
              return 0; };
            const versions = all.filter(f => p(f)).sort(cmp);
            console.log(versions.slice(+keep).filter(f => f !== `v${current}/`).join(" "));
          ' 3 "$VERSION" $folders)
          if [ -z "$old" ]; then echo "Nothing to remove"; exit 0; fi
          for f in $old; do
            case "$f" in v[0-9]*/) ;; *) echo "::error::Refusing to remove '$f'"; exit 1 ;; esac
            [ "$f" != "v$VERSION/" ] || continue
            echo "Removing $f"
            aws s3 rm "s3://$R2_BUCKET/$f" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
