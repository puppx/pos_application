name: Windows build

# Every push / PR: run tests and build the installers (downloadable from the
# run's "Artifacts").
#
# To publish a release: Actions > Windows build > Run workflow, tick
# "Publish a release". The release is tagged v<version from tauri.conf.json>.
# Pushing a tag such as v0.2.0 does the same.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<app version>) with the installers"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and whether to release
        id: ver
        shell: bash
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          echo "tauri.conf.json=$app Cargo.toml=$crate"
          if [ "$app" != "$crate" ]; then
            echo "::error::Version mismatch: tauri.conf.json has $app, Cargo.toml has $crate"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            if [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $app"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            release=true
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Updates are signed with the private key stored in the repository secret
      # TAURI_SIGNING_PRIVATE_KEY; installed apps only accept updates signed
      # with it. Without the secret the installers are still built, just
      # without auto-update files.
      - name: Build installers (NSIS .exe + MSI)
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            npx --yes @tauri-apps/cli@2 build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set: building without automatic-update files"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # latest.json is what installed apps download to learn about new versions.
      - name: Write update manifest (latest.json)
        if: steps.build.outputs.signed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          exe=$(ls target/release/bundle/nsis/*-setup.exe)
          node -e '
            const fs = require("fs"), path = require("path");
            const [exe, version, repo] = process.argv.slice(1);
            const signature = fs.readFileSync(exe + ".sig", "utf8").trim();
            const url = `https://github.com/${repo}/releases/download/v${version}/${path.basename(exe)}`;
            const target = { signature, url };
            fs.writeFileSync("latest.json", JSON.stringify({
              version, notes: `POS v${version}`, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": target, "windows-x86_64-nsis": target },
            }, null, 2));
          ' "$exe" "$VERSION" "$GITHUB_REPOSITORY"
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: POS v${{ steps.ver.outputs.version }}
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            latest.json
          body: |
            **New install:** download `POS_*_x64-setup.exe` below and run it.

            **Already installed (v0.5.0 or later):** the app finds this update by
            itself; an admin taps **Install update** and it restarts. All data is
            kept (it lives in `%APPDATA%\com.puppx.pos`).

            Windows may show "Windows protected your PC" because the installer is
            not code-signed yet: click **More info → Run anyway**.
