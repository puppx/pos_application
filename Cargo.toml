[workspace]
resolver = "2"
members = ["crates/pos-core", "src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Small, fast release binaries: important on low-end POS hardware.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep PIN hashing fast even in debug builds (argon2 is very slow unoptimised).
[profile.dev.package.argon2]
opt-level = 3
