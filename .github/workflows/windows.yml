name: Windows build

# Every push / PR: run tests and build the installers (downloadable from the
# run's "Artifacts"). Pushing a version tag such as v0.2.0 additionally
# publishes a GitHub Release with the installers attached.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag tauri.conf.json=$app Cargo.toml=$crate"
          if [ "$tag" != "$app" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match the version in tauri.conf.json ($app) and Cargo.toml ($crate)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers (NSIS .exe + MSI)
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: POS ${{ github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          body: |
            **Install / update:** download `POS_*_x64-setup.exe` below and run it.
            Installing a newer version over an older one keeps all your data
            (it lives in `%APPDATA%\com.puppx.pos`).

            Windows may show "Windows protected your PC" because the installer is
            not code-signed yet: click **More info → Run anyway**.
