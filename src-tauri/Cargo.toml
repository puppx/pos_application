[package]
name = "pos-app"
description = "Point of sale"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pos-core = { path = "../crates/pos-core" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# "Start with Windows" (Settings > Devices & display): the HKCU Run key on Windows.
tauri-plugin-autostart = "2.7"
# A second start (a double-click, or autostart while already open) shows the open window instead.
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
# TCP_NODELAY on the local server's listening socket (see server.rs).
socket2 = "0.6"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
rusqlite.workspace = true
