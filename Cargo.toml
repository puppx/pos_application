[workspace]
resolver = "2"
members = ["crates/pos-core", "src-tauri"]
# A vendored dependency, not part of this workspace (see [patch.crates-io]).
exclude = ["vendor/tiny_http"]

[workspace.package]
version = "0.13.7"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# tiny_http 0.12.0 with one fix to its connection thread pool (a burst of
# new connections could leave one never answered): see vendor/tiny_http.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

# Small, fast release binaries: important on low-end POS hardware.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep PIN hashing fast even in debug builds (argon2 is very slow unoptimised).
[profile.dev.package.argon2]
opt-level = 3
