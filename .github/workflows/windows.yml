name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers (NSIS .exe + MSI)
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
