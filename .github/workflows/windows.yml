name: Windows build

# Every push / PR: run tests and build the installers (downloadable from the
# run's "Artifacts").
#
# To publish a release: Actions > Windows build > Run workflow, tick
# "Publish a release". The release is tagged v<version from tauri.conf.json>.
# Pushing a tag such as v0.2.0 does the same.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<app version>) with the installers"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and whether to release
        id: ver
        shell: bash
        run: |
          app=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          echo "tauri.conf.json=$app Cargo.toml=$crate"
          if [ "$app" != "$crate" ]; then
            echo "::error::Version mismatch: tauri.conf.json has $app, Cargo.toml has $crate"
            exit 1
          fi
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
            if [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $app"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            release=true
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p pos-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers (NSIS .exe + MSI)
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: POS v${{ steps.ver.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          body: |
            **Install / update:** download `POS_*_x64-setup.exe` below and run it.
            Installing a newer version over an older one keeps all your data
            (it lives in `%APPDATA%\com.puppx.pos`).

            Windows may show "Windows protected your PC" because the installer is
            not code-signed yet: click **More info → Run anyway**.
